    <main>
      <p class="kicker">
        PART 3 · TASK 7
      </p>
      <h1 class="page-heading">
        Calculator
      </h1>
      <p class="lead">
        Enter two numbers and choose an arithmetic operation.
      </p>
      <section class="panel calculator">
        <div class="controls">
          <input id="numberA" type="number" step="any" placeholder="First number" aria-label="First number">
          <input id="numberB" type="number" step="any" placeholder="Second number" aria-label="Second number">
        </div>
        <div class="controls">
          <button data-operation="add">
            Add +
          </button>
          <button data-operation="subtract">
            Subtract −
          </button>
          <button data-operation="multiply">
            Multiply ×
          </button>
          <button data-operation="divide">
            Divide ÷
          </button>
        </div>
        <div id="calculatorResult" class="result" aria-live="polite">
          Result will appear here.
        </div>
      </section>
    </main>
    <footer>
      JavaScript Basics · Assignment #5
    </footer>
